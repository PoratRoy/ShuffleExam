            - generic [ref=e885]: "במחקר ביקשו לבחון את השפעתו של משוב (feedback) על ההערכה הסובייקטיבית של נבדקים בנוגע לאופן שבו ביצעו משימה. נדגמו 40 מומחים לפיזיקה ו-40 סטודנטים לפיזיקה שנה א'. בתחילת הניסוי מילאו כל הנבדקים מבחן בנושאים שונים בפיזיקה. לאחר המבחן הם התבקשו להעריך איזה ציון קיבלו, ובעבור כל נבדק חושב ההפרש בין הציון שהעריך שקיבל לבין ציונו האמיתי במבחן. לאחר מכן, הוקצו הנבדקים באופן אקראי לשתי קבוצות (בכל אחת מהן 20 מומחים ו-20 סטודנטים). בכל קבוצה מילאו הנבדקים עוד שלושה מבחנים מקבילים בפיזיקה. לאחר כל מבחן ניתן להם משוב על הישגיהם, אך המשוב היה שקרי:"
            - generic [ref=e886]: בקבוצה א' הציון שנמסר לנבחנים היה גבוה ב-15 נקודות מציונם האמיתי.
            - generic [ref=e887]: לנבחנים בקבוצה ב' נמסר ציון שהיה נמוך ב-15 נקודות מציונם האמיתי.
            - generic [ref=e888]: לבסוף, מילאו הנבחנים מבחן חמישי, שבסופו נתבקשו להעריך איזה ציון קיבלו בו, ושוב חושב ההפרש שהוזכר לעיל.
            - generic [ref=e889]: תוצאות המחקר הראו כי הנבדקים שקיבלו משוב חיובי, כלומר ציון גבוה ב-15 נקודות מהציון האמיתי שלהם, נטו להעריך את ביצועיהם כגבוהים יותר מהמציאות. גם לאחר שהמשוב הופסק, הם המשיכו להאמין שהם מצליחים יותר מכפי שהיו בפועל (p = 0.009). לעומת זאת, הנבדקים שקיבלו משוב שלילי, כלומר ציון נמוך ב-15 נקודות מציונם האמיתי, נטו להפחית מערך ביצועיהם. גם כאשר הצליחו בפועל במבחנים הבאים, הם המשיכו להעריך שהם קיבלו ציונים נמוכים יותר ממה שקיבלו באמת (p = 0.03). בנוסף, נמצא כי מומחים וסטודנטים הגיבו למשוב בצורה שונה. בעוד שהסטודנטים נטו להיות מושפעים יותר מהמשוב (p = 0.001), המומחים העריכו את ביצועיהם בצורה יציבה יותר, גם כאשר קיבלו משוב חיובי או שלילי (p = 0.08).
